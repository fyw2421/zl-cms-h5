name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # deploy-pages 要靠 token 读本次 run 的 artifact 元数据；显式声明 permissions 后未列出的作用域会被清零，
  # 缺 actions: read 时报 "No artifacts named "github-pages" were found for this workflow run"（已踩过）
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # 所有 action 钉到 commit SHA（注释保留版本号）：悬浮的 @v4 会被上游改行为带走，
      # upload-pages-artifact v3→v4 改名那次就是这么把部署打红的。升级时改 SHA + 注释，一次一处。
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # workflow 自身的静态检查：未知输入、拼错的键、无效的 permissions 在这里就红，
      # 不用等到 Deploy 步骤吐一句看不懂的 artifact 报错
      - name: Lint workflows
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0

      # 仓库里只有 zl-worklog.html 一个交付物；这里复制成 index.html，并把 head 里的 build 标记
      # 换成本次提交的短 SHA —— 部署后的冒烟校验靠它确认线上跑的到底是哪一版
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Syntax check
        run: node scripts/check.mjs

      - name: Stage site
        run: |
          set -euo pipefail
          SHA=$(echo "$GITHUB_SHA" | cut -c1-12)
          mkdir -p _site
          cp zl-worklog.html _site/index.html
          sed -i "s|<meta name=\"build\" content=\"local\">|<meta name=\"build\" content=\"${SHA}\">|" _site/index.html
          grep -Fq "<meta name=\"build\" content=\"${SHA}\">" _site/index.html

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          name: github-pages
          path: _site

      # deploy-pages 会去 Actions API 列本次 run 的 artifact；刚上传完的一两秒内元数据可能还没传播开，
      # 表现就是 "No artifacts named "github-pages" were found"。这里用同一个 token 先确认能列出它，
      # 等不到就给出可读原因（权限缺失 / artifact 名不对），而不是让 Deploy 吐那句误导性报错。
      - name: Wait for artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          for i in $(seq 1 12); do
            if curl -fsS -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
              | grep -Eq '"name": *"github-pages"'; then
              echo "artifact github-pages 已可列出（第 ${i} 次）"
              exit 0
            fi
            echo "第 ${i} 次：artifact 仍未列出，等 5s"
            sleep 5
          done
          echo "::error::60s 内仍列不到 artifact github-pages —— 查 permissions 是否含 actions: read、artifact 名是否被改"
          exit 1

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

      # 冒烟校验：Deploy 绿不等于线上是新版。GitHub Pages 的 HTML 带 cache-control: max-age=600（Fastly，
      # 缓存 10 分钟），所以新页面最长 10 分钟内对外仍是旧内容 —— 窗口给到 12 分钟，配合 ?cb= 破本地缓存。
      # PAGE_URL 为空时按 Pages 默认地址兜底；每轮打印 HTTP 状态与字节数，失败时能区分「拉不到」与「旧内容」。
      - name: Smoke check
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -uo pipefail
          SHA=$(echo "$GITHUB_SHA" | cut -c1-12)
          TARGET="${PAGE_URL:-}"
          if [ -z "$TARGET" ]; then
            TARGET="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
          fi
          echo "target=${TARGET}"
          for i in $(seq 1 36); do
            code=$(curl -sS -o /tmp/page.html -w '%{http_code}' \
              -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
              "${TARGET}?cb=${RANDOM}${i}" 2>/tmp/curl.err)
            bytes=$(wc -c < /tmp/page.html | tr -d ' ')
            live=$(grep -oE 'name="build" content="[^"]*"' /tmp/page.html 2>/dev/null | head -n1)
            if grep -Fq "<meta name=\"build\" content=\"${SHA}\">" /tmp/page.html 2>/dev/null; then
              echo "线上已是本次版本（第 ${i} 次命中）：${live}"
              exit 0
            fi
            echo "第 ${i} 次：http=${code} bytes=${bytes} 线上 ${live:-没有 build 标记}，期望 ${SHA}"
            if [ "$code" != "200" ]; then
              echo "  curl: $(cat /tmp/curl.err 2>/dev/null)"
            fi
            sleep 20
          done
          echo "::error::12 分钟内线上仍未切到 ${SHA} —— 查 Pages 是否部署失败或仍发旧包"
          exit 1
