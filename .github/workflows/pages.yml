name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # deploy-pages 要靠 token 读本次 run 的 artifact 元数据；显式声明 permissions 后未列出的作用域会被清零，
  # 缺 actions: read 时报 "No artifacts named "github-pages" were found for this workflow run"（已踩过）
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # 所有 action 钉到 commit SHA（注释保留版本号）：悬浮的 @v4 会被上游改行为带走，
      # upload-pages-artifact v3→v4 改名那次就是这么把部署打红的。升级时改 SHA + 注释，一次一处。
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # workflow 自身的静态检查：未知输入、拼错的键、无效的 permissions 在这里就红，
      # 不用等到 Deploy 步骤吐一句看不懂的 artifact 报错
      - name: Lint workflows
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0

      # 仓库里只有 zl-worklog.html 一个交付物；这里复制成 index.html，并把 head 里的 build 标记
      # 换成本次提交的短 SHA —— 部署后的冒烟校验靠它确认线上跑的到底是哪一版
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Syntax check
        run: node scripts/check.mjs

      - name: Stage site
        run: |
          set -euo pipefail
          SHA=$(echo "$GITHUB_SHA" | cut -c1-12)
          mkdir -p _site
          cp zl-worklog.html _site/index.html
          sed -i "s|<meta name=\"build\" content=\"local\">|<meta name=\"build\" content=\"${SHA}\">|" _site/index.html
          grep -Fq "<meta name=\"build\" content=\"${SHA}\">" _site/index.html

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          name: github-pages
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

      # 冒烟校验：Deploy 绿不等于线上是新版（CDN 会继续发旧包）。拉线上页面，等到 build 标记
      # 与本次短 SHA 一致；约 3 分钟仍不一致就判红，避免「显示成功、站点还是旧版」的假绿。
      - name: Smoke check
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -uo pipefail
          SHA=$(echo "$GITHUB_SHA" | cut -c1-12)
          for i in $(seq 1 18); do
            body=$(curl -fsS "${PAGE_URL}?cb=${RANDOM}${i}" 2>/dev/null || true)
            if printf '%s' "$body" | grep -Fq "<meta name=\"build\" content=\"${SHA}\">"; then
              echo "live build matches ${SHA}"
              exit 0
            fi
            echo "attempt ${i}: live page still not on ${SHA}"
            sleep 10
          done
          echo "::error::live page never served build ${SHA} — Pages 可能仍在发旧包"
          exit 1
