/* ---------- 读取日志 ---------- */
function cacheKey(date, deptId) {
  return CACHE_PREFIX + date + '_' + (deptId || 'all');
}

function readCache(date, deptId) {
  var raw = safeGet(cacheKey(date, deptId));
  if (!raw) return null;
  try { return JSON.parse(raw); } catch (e) { return null; }
}

/* 同一份 rows 要写两个键时（mine_/部门），用已序列化好的字符串，省一次 stringify */
function writeCacheJson(date, deptId, json) {
  safeSet(cacheKey(date, deptId), json);
}

function writeCache(date, deptId, rows) {
  writeCacheJson(date, deptId, JSON.stringify(rows));
}

async function fetchLogs(date, deptId) {
  var r = await api('get', '/Worklog/GetWorklogs', {
    params: { date: date, deptId: deptId, page: 1, pageSize: 1000 }
  });
  if (!r || r.code !== 0) throw new Error((r && r.msg) || '读取日志失败');
  return Array.isArray(r.data) ? r.data : [];
}

/* 提交日志的归属部门：优先登录绑定部门，否则用用户选择 */
function resolveSubmitDeptId() {
  if (state.auth && state.auth.deptId) return String(state.auth.deptId);
  return state.submitDeptId || '';
}

/* PC 端请求体里的 id 是数字（el-select 才用 String）；提交体必须还原成数字，
   否则服务端按「跨部门/他人」分支校验，会把非 7 小时的日志判为不合格。 */
function numId(v) {
  if (v === null || v === undefined || v === '') return null;
  var n = Number(v);
  return isFinite(n) ? n : v;
}

function myLogKey() {
  return state.date + '|' + resolveSubmitDeptId();
}

async function loadMyLog() {
  var myDeptId = resolveSubmitDeptId();
  if (!myDeptId) {
    state.myLog = null;
    state.myLogLoadedKey = '';
    renderWritePane();
    return null;
  }
  // 快照本次请求维度：等待期间用户切了日期/部门，结果只能落到快照对应的键上
  var reqDate = state.date;
  var rows = await fetchLogs(reqDate, myDeptId);
  var json = JSON.stringify(rows);   // 部门视图同参数时直接复用，省一次序列化
  writeCacheJson(reqDate, 'mine_' + myDeptId, json);
  if (state.date !== reqDate || resolveSubmitDeptId() !== myDeptId) return null;  // 已切换，丢弃迟到结果
  state.myLog = rows.filter(function (r) {
    return String(r.userId) === String(state.auth.userId);
  })[0] || null;
  state.myLogLoadedKey = reqDate + '|' + myDeptId;
  applyMyLogToForm();
  return { date: reqDate, deptId: myDeptId, rows: rows, json: json };
}

/* 部门日志落状态：请求成功与「复用我的日志结果」两条路径共用，避免两处口径漂移 */
function applyDeptRows(rows, date, deptId) {
  var list = Array.isArray(rows) ? rows : [];   // 缓存可能被外部改坏，非数组按空处理
  state.deptLogs = list;
  state.deptSubmitted = !!deptId && list.some(function (r) {
    return Number(r.isDeptSubmit) === 1;
  });
  state.deptLogKey = date + '|' + (deptId || 'all');
  renderReadPane();
}

async function loadDeptLogs() {
  var deptId = state.viewDeptId;
  // 同 loadMyLog：缓存与内存态都按快照维度落，避免旧数据被写成新日期的缓存
  var reqDate = state.date;
  var offline = false;
  try {
    var rows = await fetchLogs(reqDate, deptId);
    writeCache(reqDate, deptId, rows);
    if (state.date !== reqDate || state.viewDeptId !== deptId) return;
  } catch (e) {
    if (e.message === 'AUTH_EXPIRED') throw e;
    var cached = readCache(reqDate, deptId);
    if (!cached) throw e;
    if (state.date !== reqDate || state.viewDeptId !== deptId) return;
    rows = cached;
    offline = true;
  }
  offlineNotice = offline;
  applyDeptRows(rows, reqDate, deptId);
}

var offlineNotice = false;

/* ---------- 未提交草稿（本地自动保存，不动接口） ---------- */
var draftTimer = null;
function draftKey() {
  var dept = resolveSubmitDeptId() || state.viewDeptId || 'none';
  var uid = (state.auth && state.auth.userId) || 'anon';
  return DRAFT_PREFIX + uid + '|' + state.date + '|' + dept;
}
/* 登录后清理旧版无 userId 的草稿键（旧格式 日期|部门，仅 2 段），避免孤儿键长期残留 */
function pruneLegacyDrafts() {
  try {
    var drop = [];
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      if (!k || k.indexOf(DRAFT_PREFIX) !== 0) continue;
      if (k.slice(DRAFT_PREFIX.length).split('|').length !== 3) drop.push(k);
    }
    drop.forEach(function (k) { safeDel(k); });
  } catch (e) { /* 存储不可用静默 */ }
}

/* 存储水位：缓存与草稿的键里都带日期，只保留最近 STORE_KEEP_DAYS 天 + 当前维度。
   登录态 / 使用时间等非本模块键一律不动；safeSet 撞配额时也会调这里腾空间 */
var STORE_KEEP_DAYS = 7;
/* 缓存总体积预算（UTF-16 码元近似，中文 JSON 约 1 码元/汉字）：
   配额是按字节算的，光靠天数兜不住大部门——1000 行 × 两键 ≈ 711K 码元/天，
   7 天正好贴到 5MB 上限，任何额外键都会触发配额急救，所以再加一层体积上限 */
var STORE_BUDGET_CHARS = 2 * 1024 * 1024;
function storageCutoff() {
  var d = new Date(Date.now() - STORE_KEEP_DAYS * 86400000);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0')
    + '-' + String(d.getDate()).padStart(2, '0');
}
function storageDateOf(k) {
  // 缓存键 lw_h5_cache_<date>_<dept|all|mine_x>；草稿键 lw_h5_draft_<uid>|<date>|<dept>
  var d = '';
  if (k.indexOf(CACHE_PREFIX) === 0) d = k.slice(CACHE_PREFIX.length).split('_')[0] || '';
  else if (k.indexOf(DRAFT_PREFIX) === 0) d = k.slice(DRAFT_PREFIX.length).split('|')[1] || '';
  return /^\d{4}-\d{2}-\d{2}$/.test(d) ? d : '';   // 认不出日期的一律不动，避免误删
}
/* 两档清理，由调用方决定用哪档：
   默认档（启动时走这档）只删「超过保留期」的键，再按体积预算从最旧日期淘汰超额缓存；
   预算内的近期缓存一律不动，否则断网时 readCache 回退没得读，页面从「显示本机缓存」
   退化成「读取失败」；
   aggressive 档把近期缓存全部让位（草稿始终保留），仅在配额写不进去时使用。 */
function pruneStorage(keepKey, aggressive) {
  try {
    var cutoff = storageCutoff(), stale = [], recent = [];
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      if (!k || k === keepKey) continue;
      var d = storageDateOf(k);
      if (!d) continue;
      if (d < cutoff) stale.push(k);
      else if (k.indexOf(CACHE_PREFIX) === 0) recent.push({ k: k, d: d });
    }
    var drop = stale.slice();
    if (aggressive) {
      // 配额急救档：近期缓存全部让位（草稿始终保留）
      recent.forEach(function (e) { drop.push(e.k); });
    } else {
      // 常规档：天数以内再加体积预算，超预算从最旧日期开始淘汰；草稿不计也不删
      var items = recent.map(function (e) {
        return { k: e.k, d: e.d, size: e.k.length + (safeGet(e.k) || '').length };
      });
      items.sort(function (a, b) { return a.d < b.d ? -1 : (a.d > b.d ? 1 : 0); });
      var used = items.reduce(function (n, e) { return n + e.size; }, 0);
      for (var j = 0; j < items.length && used > STORE_BUDGET_CHARS; j++) {
        drop.push(items[j].k);
        used -= items[j].size;
      }
    }
    drop.forEach(function (k) { try { localStorage.removeItem(k); } catch (e) {} });
    return drop.length;
  } catch (e) { return 0; }
}
function readDraft() {
  if (!state.auth) return null;
  try {
    var raw = safeGet(draftKey());
    if (!raw) return null;
    var d = JSON.parse(raw);
    if (!d || !d.form) return null;
    return d;
  } catch (e) { return null; }
}
function persistDraft() {
  if (!state.auth) return;
  // 与初始空白表单完全一致（「点了一下标签/敲了又删」留下的空壳）没有信息量，
  // 存下来只会在下次打开时盖住服务端记录，所以直接不落盘并清掉旧键
  if (!draftDirty(state.form, null)) {
    try { safeDel(draftKey()); } catch (e) { /* 忽略 */ }
    return;
  }
  // 与服务端记录完全一致就没有草稿价值（已提交且未改动也落在这里）；清掉旧键避免下次误恢复。
  // 区别于旧版：不再因为「已提交」就一律删草稿，已提交日志的未提交修改也能保住。
  if (state.myLog && !draftDirty(state.form, state.myLog)) {
    try { safeDel(draftKey()); } catch (e) { /* 忽略 */ }
    return;
  }
  try {
    safeSet(draftKey(), JSON.stringify({ form: state.form, at: Date.now() }));
  } catch (e) { /* 存储失败静默 */ }
}
function writeDraft() {
  if (!state.auth) return;
  renderSubmitState();   // 状态行随编辑实时更新；只改文案不重绘表单，避免输入时丢光标
  clearTimeout(draftTimer);
  draftTimer = setTimeout(persistDraft, 400);
}
/* 页面卸载/切后台时同步落盘，避免 400ms 防抖未触发就丢草稿（手机刷新/锁屏常踩） */
function flushDraft() {
  if (!state.auth) return;
  clearTimeout(draftTimer);
  // 只在「表单异于服务端/初始态」时落盘；否则删除该维度草稿，避免清空内容后旧草稿复活
  if (draftDirty(state.form, state.myLog)) persistDraft();
  else { try { safeDel(draftKey()); } catch (e) {} }
}
function clearDraft() {
  clearTimeout(draftTimer);
  try { safeDel(draftKey()); } catch (e) { /* 忽略 */ }
}
/* 草稿是否「脏」：内容 / 工作状态 / 时间段任一异于服务端记录（无记录则异于初始态）。
   时段顺序无关地归一化，避免服务端返回顺序差异造成误判。 */
function normSlotsForCompare(slots) {
  return (Array.isArray(slots) ? slots : []).map(function (s) {
    return (timeOnly(s.startTime) || '') + '~' + (timeOnly(s.endTime) || '');
  }).sort().join('|');
}
function baseFormFor(serverLog) {
  if (!serverLog) {
    return { workContent: '', workStatus: 'normal', workTimeSlots: defaultSlotsFor('normal') };
  }
  return {
    workContent: serverLog.workContent || '',
    workStatus: STATUS_LABEL[serverLog.workStatus] ? serverLog.workStatus : 'normal',
    workTimeSlots: (serverLog.workTimeSlots || []).map(function (s) {
      return { startTime: timeOnly(s.startTime), endTime: timeOnly(s.endTime) };
    })
  };
}
function draftDirty(form, serverLog) {
  var f = form || {};
  var b = baseFormFor(serverLog);
  return (f.workContent || '').trim() !== (b.workContent || '').trim()
      || (STATUS_LABEL[f.workStatus] ? f.workStatus : 'normal') !== b.workStatus
      || normSlotsForCompare(f.workTimeSlots) !== normSlotsForCompare(b.workTimeSlots);
}
/* 有服务端记录时以服务端为准；无记录但本地有草稿则恢复草稿 */
function applyMyLogToForm() {
  var log = state.myLog;
  var draft = readDraft();
  var serverContent = log ? (log.workContent || '') : '';
  // 空壳草稿（内容空 + 状态 normal + 默认时段，等于初始表单）不算草稿：
  // 它和服务端记录必然「不同」，若让它参与恢复，就会把服务端的真实内容盖成空。
  // 顺带把这条脏草稿清掉，避免下次再踩。
  if (draft && !draftDirty(draft.form, null)) { clearDraft(); draft = null; }
  // 与服务端记录完全一致的草稿没有价值（含「已提交且未改动」），顺手清掉；
  // 有真实差异的草稿保留 —— 已提交日志的未提交修改也不该丢（旧版这里是「有内容就丢」）
  if (draft && log && !draftDirty(draft.form, log)) { clearDraft(); draft = null; }
  // 草稿异于服务端/初始态（内容、工作状态、时间段任一不同）→ 优先恢复，保住未提交修改
  if (draft && draftDirty(draft.form, log)) {
    state.form.workStatus = STATUS_LABEL[draft.form.workStatus] ? draft.form.workStatus : 'normal';
    state.form.workContent = draft.form.workContent || '';
    state.form.workTimeSlots = Array.isArray(draft.form.workTimeSlots) ? draft.form.workTimeSlots : defaultSlotsFor(state.form.workStatus);
    // 不再单独弹「已恢复本机草稿」提示：提交状态行已经表达同一件事，避免两处重复
  } else if (log) {
    state.form.workStatus = STATUS_LABEL[log.workStatus] ? log.workStatus : 'normal';
    state.form.workContent = serverContent;
    state.form.workTimeSlots = (log.workTimeSlots || []).map(function (s) {
      return { startTime: timeOnly(s.startTime), endTime: timeOnly(s.endTime) };
    });
    clearNotice(['draft']);
  } else {
    state.form.workStatus = 'normal';
    state.form.workContent = '';
    state.form.workTimeSlots = defaultSlotsFor('normal');
    clearNotice(['draft']);
  }
  renderWritePane();   // 内部已含 renderSlots + renderHours + renderSubmitState，不再重复调用
}

function defaultSlotsFor(status) {
  if (status === 'leave') return [];
  if (status === 'morning_leave') return [{ startTime: '13:30', endTime: '17:30' }];
  if (status === 'afternoon_leave') return [{ startTime: '09:00', endTime: '12:00' }];
  return [{ startTime: '09:00', endTime: '12:00' }, { startTime: '13:30', endTime: '17:30' }];
}

/* ---------- 渲染：写 ---------- */
function renderSubmitDeptField() {
  var field = $('submitDeptField');
  var bound = !!(state.auth && state.auth.deptId);
  field.hidden = bound;
  if (bound || !state.depts.length) return;

  var sel = $('submitDeptSelect');
  if (!state.submitDeptId || !state.depts.some(function (d) { return d.id === state.submitDeptId; })) {
    state.submitDeptId = state.depts[0].id;
  }
  sel.innerHTML = state.depts.map(function (d) {
    return '<option value="' + esc(d.id) + '">' + esc(d.deptName) + '</option>';
  }).join('');
  sel.value = state.submitDeptId;
  var vd = state.depts.filter(function (d) { return d.id === state.viewDeptId; })[0];
  $('deptText').textContent = vd ? vd.deptName : (state.depts[0] ? state.depts[0].deptName : '');
}

/* 提交状态行 + 按钮文案：接口只回日志本身、没有提交时间字段，
   所以只表达三种确定状态（已提交 / 有未提交改动 / 尚未提交），不编造时间 */
function hasSubmittedLog() {
  return !!(state.myLog && (state.myLog.workContent || '').trim());
}
function renderSubmitState() {
  var el = $('writeState');
  var btn = $('submitBtn');
  if (!el || !btn) return;
  // 提交进行中不改按钮文案：postLog 已把按钮设成「提交中…」，此时编辑表单会走到这里，
  // 若无条件重写文案就会变成「更新日志/提交日志」，误导用户以为请求结束了
  if (state.busy) return;
  var deptId = resolveSubmitDeptId();
  // 还没读到服务端记录时不给结论，避免把「加载中」说成「未提交」
  if (!deptId || state.myLogLoadedKey !== myLogKey()) {
    el.hidden = true;
    btn.textContent = '提交日志';
    return;
  }
  var submitted = hasSubmittedLog();
  var dirty = draftDirty(state.form, state.myLog);
  btn.textContent = submitted ? '更新日志' : '提交日志';
  var ok = submitted && !dirty;                 // 已保存且无改动 = 正向状态，用中性色
  var text;
  if (dirty) {
    text = submitted ? '改动未保存，刷新会还原为已提交版本' : '有未提交的草稿，确认后点「提交日志」';
  } else if (submitted) {
    text = '今日日志已提交';
  } else {
    text = '今日日志尚未提交';
  }
  el.hidden = false;
  el.innerHTML = '<span class="dept-state' + (ok ? ' ok' : '') + '">' + esc(text) + '</span>';
}

function renderWritePane() {
  $('writeDateText').textContent = state.date;
  $('dateText').textContent = state.date;
  $('dateInput').value = state.date;
  if (state.viewDeptId) {
    var d0 = state.depts.filter(function (d) { return d.id === state.viewDeptId; })[0];
    $('deptText').textContent = d0 ? d0.deptName : '';
  }
  $('workContent').value = state.form.workContent;

  var segBtns = $('statusSeg').querySelectorAll('button');
  Array.prototype.forEach.call(segBtns, function (b) {
    var st = b.getAttribute('data-status');
    b.setAttribute('aria-pressed', st === state.form.workStatus ? 'true' : 'false');
  });

  renderSubmitDeptField();

  var deptId = resolveSubmitDeptId();
  var loaded = !!deptId && state.myLogLoadedKey === myLogKey();
  var sb = $('submitBtn');
  sb.disabled = !loaded;
  var hint = $('submitHint');
  if (loaded) {
    hint.textContent = '';
  } else if (!deptId) {
    hint.textContent = '尚未选择提交部门，选择后才能填写并提交。';
  } else {
    hint.textContent = '未能读取本日已有日志，已暂时禁用提交，避免覆盖原记录。请刷新后重试。';
  }

  renderSlots();
  renderHours();
  renderSubmitState();
}

function renderSlots() {
  var wrap = $('slotList');
  wrap.innerHTML = '';
  if (!state.form.workTimeSlots.length) {
    var tip = document.createElement('p');
    tip.className = 'hint';
    tip.textContent = '暂无时间段（请假状态下不需要填写）';
    wrap.appendChild(tip);
    return;
  }
  state.form.workTimeSlots.forEach(function (slot, idx) {
    var row = document.createElement('div');
    row.className = 'slot';

    var start = document.createElement('input');
    start.className = 'input';
    start.type = 'time';
    start.step = '300';
    start.value = slot.startTime || '';
    start.setAttribute('aria-label', '开始时间');
    start.addEventListener('change', function () {
      handleSlotTime(idx, 'startTime', start.value);
    });


    var dash = document.createElement('span');
    dash.className = 'dash';
    dash.textContent = '至';

    var end = document.createElement('input');
    end.className = 'input';
    end.type = 'time';
    end.step = '300';
    end.value = slot.endTime || '';
    end.setAttribute('aria-label', '结束时间');
    end.addEventListener('change', function () {
      handleSlotTime(idx, 'endTime', end.value);
    });

    var del = document.createElement('button');
    del.className = 'icon-btn';
    del.type = 'button';
    del.setAttribute('aria-label', '删除该时间段');
    del.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linejoin="round"/></svg>';
    del.addEventListener('click', function () {
      state.form.workTimeSlots.splice(idx, 1);
      renderSlots();
      renderHours();
      writeDraft();
    });

    row.appendChild(start);
    row.appendChild(dash);
    row.appendChild(end);
    row.appendChild(del);
    wrap.appendChild(row);
  });
}

function handleSlotTime(idx, key, value) {
  var slot = state.form.workTimeSlots[idx];
  if (!slot) return;

  if (value && !isFiveStep(value)) {
    // 原生 time 选择器按 step=300 只能选 5 分钟倍数，这里是手动键入/粘贴的兜底；
    // 提示写明被调整成什么，避免用户只看到规则却不知道值变了
    slot[key] = snapFive(value);
    writeDraft();          // 赋值之后再落盘/重绘状态，否则胶囊拿到的是旧表单
    toast(value + ' 已按 5 分钟调整为 ' + slot[key]);
    renderSlots();
    renderHours();
    return;
  }

  slot[key] = value;
  writeDraft();            // 同上：先改值再写，400ms 防抖落盘照旧

  var a = toMinutes(slot.startTime);
  var b = toMinutes(slot.endTime);
  if (a !== null && b !== null && a >= b) {
    toast('开始时间必须早于结束时间');
    renderHours();
    return;
  }
  if (hasOverlap(state.form.workTimeSlots, slot, idx)) {
    toast('时间段不能交叉重复');
    renderHours();
    return;
  }
  renderHours();
}

function renderHours() {
  var h = calcHours(state.form.workTimeSlots);
  $('hoursValue').textContent = h;
}

/* 状态切换：与 PC 端行为一致 */
function setStatus(status) {
  state.form.workStatus = status;
  if (status === 'leave') {
    state.form.workTimeSlots = [];
    state.form.workContent = '请假';
  } else if (status === 'morning_leave') {
    state.form.workTimeSlots = state.form.workTimeSlots.filter(function (s) {
      return (s.endTime || '00:00') > '12:00';
    });
    if (!state.form.workTimeSlots.length) {
      state.form.workTimeSlots = [{ startTime: '13:30', endTime: '17:30' }];
    }
    state.form.workContent = '上午请假';
  } else if (status === 'afternoon_leave') {
    state.form.workTimeSlots = state.form.workTimeSlots.filter(function (s) {
      return (s.startTime || '00:00') < '12:00';
    });
    if (!state.form.workTimeSlots.length) {
      state.form.workTimeSlots = [{ startTime: '09:00', endTime: '12:00' }];
    }
    state.form.workContent = '下午请假';
  } else if (status === 'normal') {
    state.form.workTimeSlots = defaultSlotsFor('normal');
    if (state.form.workContent === '请假' || state.form.workContent === '上午请假' || state.form.workContent === '下午请假') {
      state.form.workContent = '';
    }
  }
  renderWritePane();
}

/* ---------- 渲染：读 ---------- */
/* 只读页底部：状态标签（胶囊）夹在列表卡与操作条之间，操作条只留按钮 */
function renderDeptActions() {
  var box = $('deptActionBar');
  var st = $('deptState');
  if (!state.viewDeptId) {
    // 未选部门：没有可提交的对象，只留一句说明，不出按钮
    st.hidden = false;
    st.innerHTML = '<span class="dept-state">选择具体部门后可提交当日日志</span>';
    box.hidden = true;
    box.innerHTML = '';
    return;
  }
  box.hidden = false;
  st.hidden = false;
  if (state.deptSubmitted) {
    // 已提交：状态做成胶囊标签（不再重复日期，日期已在顶部筛选行显示）+ 截图入口
    // 已提交 = 完成态，与「我的日志」的已提交提示统一为青色（ok）
    st.innerHTML = '<span class="dept-state ok">部门日志已提交</span>';
    box.innerHTML =
      '<div class="bar">' +
        '<button class="submit" id="previewShotBtn" type="button">预览截图</button>' +
      '</div>';
    $('previewShotBtn').addEventListener('click', function () {
      openShotPreview().catch(function (e) {
        if (e.message !== 'AUTH_EXPIRED') toast(e.message);
      });
    });
    return;
  }
  // 未提交：按填写情况分两态——有人没写（红字提醒）/ 全员已填（中性色，正向确认）
  // 两种情况标签都在，胶囊高度恒定，切日期时列表不跳动
  var all = state.deptLogs || [];
  var total = all.length;
  var done = 0;
  all.forEach(function (r) { if ((r.workContent || '').trim() !== '') done++; });
  var hintHtml;
  if (total && done >= total) {
    hintHtml = '<span class="dept-state ok">已全部填写，可提交</span>';
  } else if (total) {
    hintHtml = '<span class="dept-state">还有 ' + (total - done) + ' 人未填写</span>';
  } else {
    hintHtml = '<span class="dept-state">确认全员已填写后再提交</span>';
  }
  st.innerHTML = hintHtml;
  box.innerHTML =
    '<div class="bar">' +
      '<button class="submit" id="submitDeptBtn" type="button">提交部门日志</button>' +
    '</div>';
  $('submitDeptBtn').addEventListener('click', askSubmitDeptLog);
}

function renderDeptStats() {
  var rows = state.deptLogs || [];
  var filled = 0, leave = 0, sum = 0;
  rows.forEach(function (r) {
    var hasContent = (r.workContent || '').trim() !== '';
    if (hasContent) filled++;
    if (r.workStatus && r.workStatus !== 'normal') leave++;
    // 工时只统计已填写正文的人，与「已填写」同一口径，避免未填人的默认工时把总数抬高
    if (hasContent) {
      var h = Number(r.workHours);
      if (isFinite(h)) sum += h;
    }
  });
  var items = [
    { k: '总人数', v: rows.length },
    { k: '已填写', v: filled },
    { k: '请假', v: leave },
    { k: '已填工时', v: Math.round(sum * 10) / 10 }
  ];
  $('deptStats').innerHTML = items.map(function (i) {
    return '<div class="stat"><span class="k">' + i.k + '</span><span class="v">' + i.v + '</span></div>';
  }).join('');
}

function renderReadPane() {
  renderDeptStats();
  renderDeptActions();
  var box = $('readContent');
  // 视图名由标签页承担、人数由统计块「总人数」承担，这里不再重复标题

  if (offlineNotice) {
    setNotice('offline', 'warn', '当前网络不可用，显示的是本机缓存数据，可能不是最新。');
  } else {
    clearNotice('offline');
  }

  if (!state.deptLogs.length) {
    box.innerHTML = '<div class="empty">当日暂无日志记录</div>';
    return;
  }

  var myId = state.auth ? String(state.auth.userId) : '';
  var html = ['<div class="log-list">'];
  state.deptLogs.forEach(function (row) {
    var mine = myId && String(row.userId) === myId;
    var status = STATUS_LABEL[row.workStatus] ? row.workStatus : 'normal';
    var content = (row.workContent || '').trim();
    var slots = (row.workTimeSlots || []).map(function (s) {
      var a = timeOnly(s.startTime);
      var b = timeOnly(s.endTime);
      if (!a && !b) return '';
      return '<span>' + esc(a) + ' - ' + esc(b) + '</span>';
    }).filter(Boolean).join('');

    var pending = !content;
    html.push('<div class="log-item' + (pending ? ' pending' : (mine ? ' mine' : '')) + (status !== 'normal' && !pending ? ' ' + status : '') + '">');
    html.push('<div class="log-head">');
    html.push('<span class="nm">' + esc(row.realName || ('用户' + (row.userId || ''))) + '</span>');
    if (mine) html.push('<span class="badge">我</span>');
    if (pending) {
      html.push('<span class="chip danger">未提交</span>');
    } else {
      html.push('<span class="chip ' + status + '">' + esc(STATUS_LABEL[status]) + '</span>');
    }
    // 时段胶囊放在工时之前：常态与头部同一行，宽度不够时由 flex-wrap 折到下一行
    if (slots) html.push('<span class="log-slots">' + slots + '</span>');
    html.push('<span class="hours' + (pending ? ' pending' : '') + '">' + (pending ? '—' : (row.workHours == null ? '—' : esc(row.workHours) + ' 小时')) + '</span>');
    html.push('</div>');
    html.push('<div class="log-content' + (pending ? ' pending' : (content ? '' : ' empty')) + '">' + (pending ? '未填写工作内容，当日日志尚未提交' : (content ? esc(content) : '未填写工作内容')) + '</div>');
    html.push('</div>');
  });
  html.push('</div>');
  box.innerHTML = html.join('');
}

/* ---------- 提交 ---------- */
function validateForm() {
  var f = state.form;
  if (!f.workContent.trim()) return '请填写工作内容';

  for (var i = 0; i < f.workTimeSlots.length; i++) {
    var s = f.workTimeSlots[i];
    if (!s.startTime || !s.endTime) return '请完善时间段信息';
    if (!isFiveStep(s.startTime) || !isFiveStep(s.endTime)) return '时间必须是 5 分钟的倍数';
    var a = toMinutes(s.startTime);
    var b = toMinutes(s.endTime);
    if (a === null || b === null) return '时间段格式不正确';
    if (a >= b) return '开始时间必须早于结束时间';
    if (hasOverlap(f.workTimeSlots, s, i)) return '时间段不能交叉重复';
    /* 服务端规则（已实测）：当天日志的结束时间不能晚于当前时间 */
    if (state.date === todayStr() && s.endTime > nowHHmm()) {
      return '结束时间不能晚于当前时间（' + nowHHmm() + '）';
    }
  }
  return '';
}

function submitLog() {
  if (state.busy) return;

  var err = validateForm();
  if (err) { toast(err); return; }

  var hours = calcHours(state.form.workTimeSlots);

  if (state.form.workStatus === 'normal' && hours <= 0) {
    showConfirm(
      '工时为 0 小时',
      '当前没有有效的工作时间段，提交后工时为 0 小时，会出现在部门日志统计里。\n确定继续提交吗？',
      '仍要提交',
      true,
      function () { postLog(); }
    );
    return;
  }

  /* 服务端规则：状态为「正常上班」时，工作日的工时不得少于 7 小时，
     不足会返回「正常工作日您选择的时间段小于7小时…」。这里先提示，
     免得填完才被拒；节假日由服务端判定，所以仍允许继续提交。 */
  if (state.form.workStatus === 'normal' && hours < 7) {
    showConfirm(
      '工时不足 7 小时',
      '当前状态是「正常上班」，工时为 ' + hours + ' 小时。\n'
      + '正常工作日提交少于 7 小时，服务端会拒绝（提示「正常工作日您选择的时间段小于7小时」）。\n\n'
      + '建议：把状态改为「上午请假 / 下午请假 / 全天请假」，或把时间段补足 7 小时。\n'
      + '若当天是周末或节假日，可以继续提交。',
      '仍要提交',
      true,
      function () { postLog(); }
    );
    return;
  }

  postLog();
}

async function postLog() {
  if (state.busy) return;

  var myDeptId = (state.myLog && state.myLog.deptId) || resolveSubmitDeptId();
  if (!myDeptId) { toast('请先选择提交部门'); return; }

  var myUserId = (state.myLog && state.myLog.userId) || (state.auth && state.auth.userId) || null;

  var payload = {
    workHours: calcHours(state.form.workTimeSlots),
    workContent: state.form.workContent.trim(),
    workStatus: state.form.workStatus,
    workTimeSlots: state.form.workTimeSlots.map(function (s) {
      return {
        startTime: timeOnly(s.startTime) ? state.date + ' ' + timeOnly(s.startTime) : null,
        endTime: timeOnly(s.endTime) ? state.date + ' ' + timeOnly(s.endTime) : null
      };
    }),
    date: state.date,
    userId: numId(myUserId),
    deptId: numId(myDeptId)
  };

  var btn = $('submitBtn');
  state.busy = true;
  btn.disabled = true;
  btn.textContent = '提交中…';

  try {
    var r = await api('post', '/Worklog/SaveWorklog', { body: payload });
    if (r && r.code === 0) {
      clearDraft();
      clearNotice(['draft']);
      toast('提交成功');
      await refresh();
    } else {
      toast((r && r.msg) || '提交失败');
    }
  } catch (e) {
    if (e.message !== 'AUTH_EXPIRED') toast(e.message);
  } finally {
    state.busy = false;
    // busy 放开后补一次状态行重绘：提交成功后胶囊才会从「改动未保存」切到「今日日志已提交」，
    // 按钮文案也由 renderSubmitState 统一写，避免两处各维护一份
    renderSubmitState();
    btn.disabled = state.myLogLoadedKey !== myLogKey();
  }
}

/* ---------- 提交部门日志 ---------- */
function askSubmitDeptLog() {
  var deptId = state.viewDeptId;
  if (!deptId) { toast('请先选择具体部门'); return; }
  showConfirm(
    '提交部门日志',
    '确定提交【' + deptNameOf(deptId) + '】在【' + state.date + '】的部门日志吗？\n提交后该部门当日日志会计入工作情况统计。',
    '确定提交',
    false,
    function () { submitDeptLog(deptId); }
  );
}

async function submitDeptLog(deptId) {
  if (state.deptBusy) return;
  var btn = $('submitDeptBtn');
  state.deptBusy = true;
  if (btn) { btn.disabled = true; btn.textContent = '提交中…'; }
  try {
    var r = await api('post', '/Worklog/SaveDeptWorklog', { body: { date: state.date, deptId: deptId } });
    if (r && r.code === 0) {
      toast(r.msg || '提交部门日志成功');
      await refresh();
      try { await openShotPreview(); }
      catch (e) { if (e.message !== 'AUTH_EXPIRED') toast('提交成功，但截图预览失败'); }
    } else {
      toast((r && r.msg) || '提交部门日志失败');
    }
  } catch (e) {
    if (e.message !== 'AUTH_EXPIRED') toast(e.message);
  } finally {
    state.deptBusy = false;
    if (btn && btn.isConnected) { btn.disabled = false; btn.textContent = '提交部门日志'; }
  }
}

/* ---------- 部门日志截图预览 ---------- */
var SHOT_W = 1130;
var SHOT_MAX_H = 8000;   // 异常数据产品阈值（非 canvas 硬上限 32767），超界截断
/* 规格对齐线上 PC 端 .screenshot-*（真机 getComputedStyle 实测）：
   表 width:1000px 水平居中、border:1px solid #ddd 全网格（th/td 四边均有边框，含表体行间横线）、
   表头 bg #f5f5f5/17px 加粗居中、正文 16px、内容 line-height:1.6(25.6)、时段 line-height:1.8(28.8)、
   vertical-align:middle；列宽 DOM 实测 60/100/80/630/130，合计 1000 */
var SHOT_TABLE_X = 65;                       // 1000 表在 1130 画布内居中：(1130-1000)/2
var SHOT_COLS = [60, 100, 80, 630, 130];
var SHOT_TABLE_W = 1000;
var SHOT_BORDER = '#ddd';
var SHOT_HEAD_BG = '#f5f5f5';
var SHOT_HEAD_FS = 17;
var SHOT_TITLE_FS = 20;
var SHOT_LINE_H = 26;      // 内容行高 16×1.6
var SHOT_PERIOD_H = 29;   // 时段行高 16×1.8
var SHOT_PERIOD_GAP = 3;
var SHOT_CELL_PAD = 5;
var SHOT_FONT = '16px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';

function shotColX(i) { var x = SHOT_TABLE_X; for (var k = 0; k < i; k++) x += SHOT_COLS[k]; return x; }

/* Canvas 的 fillText 不展开 \t，而 PC 端 HTML 按 8 字符制表位展开。
   这里按同样规则补空格（如 "1.\t测试" → "1.      测试"），保持与 PC 截图一致 */
function shotExpandTabs(seg) {
  var out = '', col = 0;
  Array.from(seg).forEach(function (ch) {
    if (ch === '\t') {
      var n = 8 - (col % 8);
      out += '          '.slice(0, n);
      col += n;
    } else {
      out += ch;
      col++;
    }
  });
  return out;
}

/* 按列宽硬切换行：字符累积 + measureText，不靠空格分词；保留原文 \n 分段。
   用 Array.from 按码点迭代，避免把 emoji 等代理对劈成半个码元 */
function shotWrap(ctx, text, maxW) {
  var out = [];
  String(text == null ? '' : text).split('\n').forEach(function (seg) {
    var line = '';
    Array.from(shotExpandTabs(seg)).forEach(function (ch) {
      if (line && ctx.measureText(line + ch).width > maxW) { out.push(line); line = ch; }
      else { line += ch; }
    });
    if (line) out.push(line);
  });
  return out.length ? out : [''];
}

function shotPeriodLine(slot) {
  var a = timeOnly(slot && slot.startTime);
  var b = timeOnly(slot && slot.endTime);
  if (a && b) return a + ' - ' + b;
  return a || b || '';
}

/* 测量 → 定高 → 取 ctx → 绘制；全程不再写 width/height，禁止行数截断 */
function buildShotCanvas() {
  var canvas = $('shotCanvas');
  var ctx = canvas.getContext('2d');
  var rows = state.deptLogs || [];

  // 1) 测量：先算每行行高与总高（此时画布尚未定尺寸）
  var titleBottom = 66;          // 标题区(基线36) + margin-bottom 20 后的表头顶线
  var headerH = 40;
  var bottomPad = 20;
  var rowHeights = [];
  var rowTops = [];
  var rowLines = [];      // 测量阶段已算好的折行结果，绘制阶段直接复用，避免整表重跑 measureText
  var rowPeriods = [];
  var totalH = titleBottom + headerH;
  var truncated = false;
  ctx.font = SHOT_FONT;
  for (var i = 0; i < rows.length; i++) {
    var r = rows[i];
    var contentLines = shotWrap(ctx, r.workContent || '', SHOT_COLS[3] - 16);
    var periods = (Array.isArray(r.workTimeSlots) ? r.workTimeSlots : []).map(shotPeriodLine).filter(Boolean);
    var ch = contentLines.length * SHOT_LINE_H;
    var ph = periods.length * SHOT_PERIOD_H + Math.max(0, periods.length - 1) * SHOT_PERIOD_GAP;
    var rh = Math.max(ch, ph, SHOT_LINE_H) + SHOT_CELL_PAD * 2;
    // 放不下的行不会绘制，测量也到此为止：与绘制用同一判据，让 rowHeights 长度成为
    // 「可绘制行数」的唯一事实源。否则 1000 行部门要测 1000 行、只画 127 行，约 87% 白跑
    if (totalH + rh > SHOT_MAX_H - bottomPad) { truncated = true; break; }
    rowHeights.push(rh);
    rowLines.push(contentLines);
    rowPeriods.push(periods);
    totalH += rh;
  }
  totalH += bottomPad;   // 循环内已保证 totalH ≤ SHOT_MAX_H，不再二次截断（避免空白底边）

  // 2) 一次性定高，此后不再改 width/height
  canvas.width = SHOT_W;
  canvas.height = totalH;

  // 3) 绘制（定高后重设字体与对齐）
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, SHOT_W, totalH);

  var yHeader = titleBottom;                // 表头顶线
  var rowY = yHeader + headerH;            // 表头底线 / 数据起始
  var ry = rowY;
  // 与测量同一口径：只对参与绘制的行算 top，rowHeights 之外的下标不存在，避免 undefined → NaN 传染
  for (var i = 0; i < rowHeights.length; i++) { rowTops.push(ry); ry += rowHeights[i]; }
  var tableBottom = ry;

  // 标题（.screenshot-title: 20px/700/center/#000，margin-bottom 20）
  ctx.font = 'bold ' + SHOT_TITLE_FS + 'px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#000';
  ctx.fillText('[' + deptNameOf(state.viewDeptId) + '][' + state.date + ']工作日志', SHOT_W / 2, 36);

  // 表头铺底 #f5f5f5
  ctx.fillStyle = SHOT_HEAD_BG;
  ctx.fillRect(SHOT_TABLE_X, yHeader, SHOT_TABLE_W, headerH);

  // 全网格 #ddd（PC th/td 均 border:1px solid #ddd，含表体行间横线与右框）
  ctx.strokeStyle = SHOT_BORDER;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(SHOT_TABLE_X, yHeader); ctx.lineTo(SHOT_TABLE_X + SHOT_TABLE_W, yHeader);   // 表头顶线
  ctx.moveTo(SHOT_TABLE_X, rowY); ctx.lineTo(SHOT_TABLE_X + SHOT_TABLE_W, rowY);         // 表头底线
  for (var i = 0; i < rowTops.length; i++) {
    var by = rowTops[i] + rowHeights[i];
    if (by > SHOT_MAX_H - bottomPad) break;
    ctx.moveTo(SHOT_TABLE_X, by);
    ctx.lineTo(SHOT_TABLE_X + SHOT_TABLE_W, by);                                          // 每行底线（行间横线）
  }
  ctx.stroke();
  for (var v = 0; v <= 5; v++) {                                       // 左框 + 4 列分隔 + 右框竖线
    var vx = v === 5 ? SHOT_TABLE_X + SHOT_TABLE_W : shotColX(v);
    ctx.beginPath();
    ctx.moveTo(vx, yHeader);
    ctx.lineTo(vx, tableBottom);
    ctx.stroke();
  }

  // 表头文字 17px 加粗居中
  ctx.font = 'bold ' + SHOT_HEAD_FS + 'px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
  ctx.fillStyle = '#000';
  var heads = ['序号', '姓名', '工作时长', '工作内容', '工作时间段'];
  for (var c = 0; c < 5; c++) {
    ctx.fillText(heads[c], shotColX(c) + SHOT_COLS[c] / 2, yHeader + headerH / 2);
  }

  // 数据行：单元格垂直居中（vertical-align:middle），内容左对齐、序号/姓名/时长/时段居中
  ctx.font = SHOT_FONT;
  ctx.fillStyle = '#000';
  for (var i = 0; i < rowHeights.length; i++) {
    var top = rowTops[i], rh = rowHeights[i];
    var r = rows[i];
    var contentLines = rowLines[i];       // 复用测量结果
    var periods = rowPeriods[i];
    var ch = contentLines.length * SHOT_LINE_H;
    var ph = periods.length * SHOT_PERIOD_H + Math.max(0, periods.length - 1) * SHOT_PERIOD_GAP;
    var contentTop = top + (rh - ch) / 2;                                                   // 工作内容块独立垂直居中
    var centerY = top + rh / 2;

    ctx.textAlign = 'center';
    ctx.fillText(String(i + 1), shotColX(0) + SHOT_COLS[0] / 2, centerY);                 // 序号
    var name = r.realName || (r.userId ? '用户' + r.userId : '用户');
    ctx.fillText(name, shotColX(1) + SHOT_COLS[1] / 2, centerY);                            // 姓名
    var h = r.workHours;                                                                    // 时长原样，空留空，不做 <7h 高亮
    var hText = (h === null || h === undefined || h === '') ? '' : String(h);
    if (hText) ctx.fillText(hText, shotColX(2) + SHOT_COLS[2] / 2, centerY);
    ctx.textAlign = 'left';                                                                 // 工作内容左对齐逐行
    for (var l = 0; l < contentLines.length; l++) {
      ctx.fillText(contentLines[l], shotColX(3) + 8, contentTop + l * SHOT_LINE_H + SHOT_LINE_H / 2);
    }
    ctx.textAlign = 'left';                                                                // 时间段左对齐逐行（对齐 PC）
    var timeTop = top + (rh - ph) / 2;                                                      // 时间段块独立垂直居中
    for (var p = 0; p < periods.length; p++) {
      ctx.fillText(periods[p], shotColX(4) + 8, timeTop + p * (SHOT_PERIOD_H + SHOT_PERIOD_GAP) + SHOT_PERIOD_H / 2);
    }
  }
  if (truncated) {
    ctx.textAlign = 'center';
    ctx.fillStyle = '#6b7480';
    ctx.fillText('…', SHOT_W / 2, Math.min(tableBottom + 16, SHOT_MAX_H - bottomPad));
    console.warn('部门日志截图内容过长，已在 8000px 处截断');
    toast('内容过长，截图已截断');
  }
  // 新绘制后旧 Blob/ObjectURL 缓存失效，避免转发/复制/下载/灯箱用到上一帧
  invalidateShotBlob();
}

/* 门控 → 空数据判定 → 绘制 → openModal；auto/manual 同一入口 */
var shotPreviewBusy = false;   // 门控请求期间的并发锁，避免重复触发
var shotPreviewToken = 0;      // 取消令牌：关闭/ESC 自增，使进行中的门控结果作废
async function openShotPreview() {
  if (!state.viewDeptId) { toast('请先选择具体部门'); return; }
  if (shotPreviewBusy) return;
  var myToken = ++shotPreviewToken;
  // 快照本次门控所用的日期/部门：等待接口期间用户若切换，结果不得配新 state 绘制
  var reqDate = state.date, reqDept = state.viewDeptId;
  shotPreviewBusy = true;
  var r;
  try {
    // C2：deptId 传 String（select 值），不套 numId；C1：AUTH_EXPIRED 原样透传
    r = await api('get', '/Worklog/ConfirmDeptWorklogSubmit', {
      params: { date: reqDate, deptId: reqDept }
    });
  } catch (e) {
    if (e.message === 'AUTH_EXPIRED') throw e;
    if (myToken !== shotPreviewToken) return;   // 已被关闭取消，迟到的错误不再提示
    // 网络失败/403/接口异常透传原始错误，不再一律误报「请先提交部门日志」
    toast(e.message || '部门日志预览失败');
    return;
  } finally {
    shotPreviewBusy = false;
  }
  if (myToken !== shotPreviewToken) return;      // 门控期间已被关闭取消
  if (state.date !== reqDate || state.viewDeptId !== reqDept) return;  // 已切换，丢弃旧结果
  if (!(r && r.code === 0 && r.data)) { toast('请先提交部门日志'); return; }
  openShotRender();
}

function openShotRender() {
  if (!(state.deptLogs || []).length) { toast('当日暂无日志记录'); return; }
  buildShotCanvas();
  configureShotCopyBtn();   // 按能力把左钮设为 转发 / 复制截图 / 隐藏，避免与「下载截图」重复
  openModal($('shotMask'), null);
}

// 绘制后缓存同一份 PNG Blob，转发/复制/下载/灯箱复用，避免 1130×8000 大图反复编码
var shotBlobCache = null;
var shotObjectUrl = null;
function invalidateShotBlob() {
  if (shotObjectUrl) { URL.revokeObjectURL(shotObjectUrl); shotObjectUrl = null; }
  shotBlobCache = null;
}
function withShotBlob(canvas, cb) {
  if (shotBlobCache) { cb(shotBlobCache); return; }
  canvas.toBlob(function (blob) {
    // 编码在飞时预览被关掉（releaseShotCanvas 已把画布置 0×0），晚到的结果不许进缓存，
    // 否则下次打开会直接复用这张残图
    if (blob && canvas.width > 0 && canvas.height > 0) shotBlobCache = blob;
    cb(blob);
  }, 'image/png');
}

/* 左钮按环境配置：支持文件分享→「转发」(Web Share 拉起微信等)；否则 https 剪贴板→「复制截图」；
   两者都不支持(http 手机)→隐藏，只留「下载截图」，不再重复一个保存入口 */
function configureShotCopyBtn() {
  var btn = $('shotCopy');
  var canvas = $('shotCanvas');
  var canCopy = window.isSecureContext && navigator.clipboard && typeof navigator.clipboard.write === 'function'
    && typeof ClipboardItem !== 'undefined';
  // 能力判定依赖 Blob（异步），先藏起来：否则大图编码的几百毫秒里按钮先冒充「复制截图」，
  // 用户在 http 手机上抢点会走到复制分支拿到「无法复制」的错
  btn.hidden = true;
  btn.dataset.mode = 'copy';
  btn.textContent = '复制截图';
  // 非安全上下文：share 与 clipboard 都被浏览器禁用（http 下 navigator.share 常常存在但
  // canShare({files}) 恒为 false，按存在性判会漏），直接隐藏。这里刻意不预热 Blob——
  // 按钮都藏了，把编码留给真正要用的人：下载自带 toBlob 路径，灯箱在 openLb 里异步编码一次
  // 并回填 shotBlobCache，之后复用；不点这两处的用户不为一次 5–7MB 的 PNG 编码买单
  if (!window.isSecureContext) return;
  withShotBlob(canvas, function (blob) {
    if (!blob) return;
    try {
      var file = new File([blob], shotFileName(), { type: 'image/png' });
      if (typeof navigator.share === 'function' && navigator.canShare && navigator.canShare({ files: [file] })) {
        btn.dataset.mode = 'forward';
        btn.textContent = '转发';
        btn.hidden = false;
        return;
      }
    } catch (e) { /* 旧浏览器无 File 构造，保持复制/隐藏判定 */ }
    if (!canCopy) { btn.hidden = true; return; }
    btn.hidden = false;
  });
}

/* 左钮统一入口：按 dataset.mode 分发转发 / 复制 */
function onShotCopyClick() {
  var canvas = $('shotCanvas');
  if ($('shotCopy').dataset.mode === 'forward') forwardShot(canvas);
  else copyShot(canvas);
}

/* 转发：Web Share 文件分享，拉起系统分享面板（微信/QQ 等由系统列出，点选即发）；不支持则提示走下载。
   files 分享要求安全上下文(https)，http 内网 canShare 返回 false，此时按钮隐藏、不出现无效入口 */
function forwardShot(canvas) {
  // share() 必须在用户手势的同步调用栈里执行；缓存未就绪时不走异步 toBlob 回调，
  // 否则手机浏览器会因用户激活失效而静默拒绝。缓存已在打开弹窗时预热。
  if (!shotBlobCache) { toast('截图生成中，请稍后再试'); return; }
  var blob = shotBlobCache;
  try {
    var file = new File([blob], shotFileName(), { type: 'image/png' });
    if (typeof navigator.share === 'function' && navigator.canShare && navigator.canShare({ files: [file] })) {
      var dept = deptNameOf(state.viewDeptId);
      navigator.share({
        files: [file],
        title: '工作日志截图',
        text: '[' + dept + '][' + state.date + ']工作日志'
      }).catch(function (err) {
        if (err && err.name === 'AbortError') return;   // 用户主动取消，静默
        toast('转发失败，请用下载截图');
      });
      return;
    }
  } catch (e) { /* 落到提示 */ }
  toast('当前浏览器不支持直接转发，请用下载截图');
}

function closeShotPreview() {
  shotPreviewToken++;   // 使正在进行的门控结果作废，关闭后不得再自动开窗
  closeModal($('shotMask'), null);
  releaseShotCanvas();
}

/* 关闭即释放位图：常态 1130×1200~1600 的 RGBA 约 5–7MB，内容超长截断到 8000px 时达 36MB；
   留着等下次预览没有任何收益，重开时 buildShotCanvas 会重新定尺寸重绘 */
function releaseShotCanvas() {
  var c = $('shotCanvas');
  if (c && (c.width || c.height)) { c.width = 0; c.height = 0; }
  invalidateShotBlob();   // 连带清掉 PNG 缓存并 revoke objectURL
}

/* 导出文件名：日期_部门.png，非法文件名字符替换为 _ */
function shotFileName() {
  var dept = deptNameOf(state.viewDeptId).replace(/[\\/:*?"<>|]/g, '_');
  return '工作日志截图_' + state.date + '_' + dept + '.png';
}

function downloadShot(canvas) {
  withShotBlob(canvas, function (blob) {
    if (!blob) { toast('截图生成失败'); return; }
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = shotFileName();
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
    toast(isIOS ? '已打开图片，长按保存到相册' : '图片已下载，发微信时在输入框点「+」→相册选择');
  });
}

/* 复制：仅安全上下文且 ClipboardItem 可用时写图；失败提示走下载(下载有独立按钮，不再自动保存避免重复) */
function copyShot(canvas) {
  withShotBlob(canvas, function (blob) {
    if (!blob) { toast('截图生成失败'); return; }
    if (window.isSecureContext && navigator.clipboard && typeof navigator.clipboard.write === 'function'
        && typeof ClipboardItem !== 'undefined') {
      navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })])
        .then(function () { toast('截图已复制到剪贴板'); })
        .catch(function () { toast('复制失败，请用下载截图'); });
      return;
    }
    toast('当前环境无法复制图片，请用下载截图');
  });
}

/* ---------- 刷新 ---------- */
async function refresh() {
  clearNotice(['my', 'dept']);
  var mine = null;
  try {
    mine = await loadMyLog();
  } catch (e) {
    if (e.message === 'AUTH_EXPIRED') return;
    var myDeptId = resolveSubmitDeptId();
    var cached = myDeptId ? readCache(state.date, 'mine_' + myDeptId) : null;
    if (cached && state.auth) {
      state.myLog = cached.filter(function (r) {
        return String(r.userId) === String(state.auth.userId);
      })[0] || null;
      state.myLogLoadedKey = myLogKey();
      applyMyLogToForm();
      setNotice('my', 'warn', '网络不可用，当前显示本机缓存的「我的日志」，提交前请确认内容。');
    } else {
      // 没缓存又读失败：必须清掉上一天的记录，否则表单会留着旧内容、按钮还能提交
      state.myLog = null;
      state.myLogLoadedKey = '';
      applyMyLogToForm();   // 按新维度重算表单（有本机草稿则恢复，否则回到初始态）
      setNotice('my', 'error', '读取「我的日志」失败：' + e.message);
    }
  }

  try {
    // 绑定部门账号下 viewDeptId 与提交部门是同一个，GetWorklogs 的 date/deptId/page/pageSize
    // 完全一致：直接复用「我的日志」那次结果，省掉一次整表请求 + 一次解析 + 一次序列化
    if (mine && mine.date === state.date && mine.deptId === String(state.viewDeptId || '')) {
      writeCacheJson(mine.date, mine.deptId, mine.json);
      offlineNotice = false;
      applyDeptRows(mine.rows, mine.date, mine.deptId);
    } else {
      await loadDeptLogs();
    }
  } catch (e) {
    if (e.message === 'AUTH_EXPIRED') return;
    // 同上：清掉旧日期的列表，避免新日期下显示上一天的内容
    state.deptLogs = [];
    state.deptSubmitted = false;
    state.deptLogKey = '';
    renderReadPane();
    setNotice('dept', 'error', '读取部门日志失败：' + e.message);
  }
}

async function bootstrap() {
  state.date = state.date || todayStr();
  $('dateInput').value = state.date;
  pruneStorage('', false);   // 启动只回收过期键：近 7 天的缓存必须留着给断网回退用
  await loadDepts();
  await refresh();
}

/* ---------- 交互绑定 ---------- */
$('loginForm').addEventListener('submit', function (e) {

});
$('tipsBtn').addEventListener('click', function () { openModal($('tipsMask'), $('tipsBtn')); });
$('tipsClose').addEventListener('click', function () { closeModal($('tipsMask'), $('tipsBtn')); });
$('tipsMask').addEventListener('click', function (e) { if (e.target === $('tipsMask')) closeModal($('tipsMask'), $('tipsBtn')); });
$('logoutBtn').addEventListener('click', doLogout);

$('dateInput').addEventListener('change', function () {
  var v = $('dateInput').value;

  $('dateText').textContent = v;

$('deptSelect').addEventListener('change', function () {

  });
});

$('statusSeg').addEventListener('click', function (e) {

$('workContent').addEventListener('input', function () {

$('addSlotBtn').addEventListener('click', function () {
  var slots = state.form.workTimeSlots;
  var last = slots[slots.length - 1];
  var next = { startTime: '13:30', endTime: '17:30' };
  if (last && last.endTime < '12:00') next = { startTime: '13:30', endTime: '17:30' };
  else if (last && last.endTime < '18:00') next = { startTime: '18:00', endTime: '20:00' };

  if (hasOverlap(slots, next, -1)) {
    // 冲突就不再加：以前提示完仍旧 push，会留下一条交叉时段，直到提交校验才报错
    toast('新增时间段与现有时间段冲突，请手动调整');
    return;
  }
  slots.push(next);
  renderSlots();
  renderHours();
  writeDraft();
});

/* 全屏编辑工作内容 */
var editorEnterValue = '';   // 进入全屏时的内容快照，供「取消」回滚
function openEditor() {
  editorEnterValue = $('workContent').value;   // 记录快照
  $('editorArea').value = editorEnterValue;
  $('editorCount').textContent = editorEnterValue.length + ' 字';
  $('editorOverlay').classList.add('show');
  setTimeout(function () { try { $('editorArea').focus(); } catch (e) {} }, 30);
}
function closeEditor() {
  $('workContent').value = $('editorArea').value;
  state.form.workContent = $('editorArea').value;
  $('editorOverlay').classList.remove('show');
  writeDraft();
  editorEnterValue = '';
}
/* 取消：放弃本次全屏修改，编辑区 + 主表单 + 草稿三者一起回到进入前快照 */
function cancelEditor() {
  $('editorArea').value = editorEnterValue;
  $('workContent').value = editorEnterValue;
  state.form.workContent = editorEnterValue;
  $('editorOverlay').classList.remove('show');
  clearTimeout(draftTimer);
  // 用快照口径覆盖草稿：编辑期间实时写入的草稿必须回滚；仅状态/时段有修改（内容为空）也要保住
  if (draftDirty(state.form, state.myLog)) persistDraft();
  else { try { safeDel(draftKey()); } catch (e) {} }
  editorEnterValue = '';
}
$('expandBtn').addEventListener('click', openEditor);
$('editorDone').addEventListener('click', closeEditor);
$('editorCancel').addEventListener('click', cancelEditor);
$('editorArea').addEventListener('input', function () {
  $('editorCount').textContent = this.value.length + ' 字';
  state.form.workContent = this.value;
  writeDraft();
});

$('submitBtn').addEventListener('click', submitLog);

$('modalCancel').addEventListener('click', hideConfirm);
$('modalOk').addEventListener('click', function () {
  var cb = modalCallback;
  hideConfirm();
  if (cb) cb();
});
$('modalMask').addEventListener('click', function (e) {
  if (e.target === $('modalMask')) hideConfirm();
});

$('shotClose').addEventListener('click', closeShotPreview);
// 左上「预览」按钮、点图片本身共用下方灯箱闭包内的 openLb() 全屏放大入口
// 灯箱：全屏放大查看；手机双指捏合缩放/单指拖拽平移，桌面鼠标滚轮缩放；点遮罩或右上角关闭退出
(function () {
  var lb = $('shotLightbox');
  var img = $('lightboxImg');
  var canvas = $('shotCanvas');
  var scale = 1, tx = 0, ty = 0;
  var pinch = null, pan = null;

  function apply() { img.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + scale + ')'; }
  function reset() { scale = 1; tx = 0; ty = 0; apply(); }
  function dist(a, b) { return Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY); }
  var lbGen = 0;   // 打开序号：关闭/重开后，迟到的编码结果不得再写 src
  function openLb() {
    if (!lb.hidden) return;
    reset();
    lb.hidden = false;
    try { $('lightboxClose').focus({ preventScroll: true }); } catch (e) { $('lightboxClose').focus(); }
    var gen = ++lbGen;
    // 统一走 Blob（objectURL）：http 下 configureShotCopyBtn 早退不预热缓存，
    // 走 toDataURL 会每次放大都在主线程同步编码一张 1130×N 的 PNG，并把 base64 串挂进 src。
    // 首次编码不可避免（异步、不阻塞点击），结果进 shotBlobCache，之后再放大直接复用。
    withShotBlob(canvas, function (blob) {
      if (gen !== lbGen || lb.hidden) return;
      if (!blob) { toast('截图生成失败'); return; }
      if (shotObjectUrl) URL.revokeObjectURL(shotObjectUrl);
      shotObjectUrl = URL.createObjectURL(blob);
      img.src = shotObjectUrl;
    });
  }

  img.addEventListener('touchstart', function (e) {
    if (e.touches.length === 2) {
      pinch = { d: dist(e.touches[0], e.touches[1]), s: scale,
        cx: (e.touches[0].clientX + e.touches[1].clientX) / 2,
        cy: (e.touches[0].clientY + e.touches[1].clientY) / 2, tx: tx, ty: ty };
      pan = null;
    } else if (e.touches.length === 1 && scale > 1) {
      pan = { x: e.touches[0].clientX, y: e.touches[0].clientY, tx: tx, ty: ty };
    }
  }, { passive: false });

  img.addEventListener('touchmove', function (e) {
    if (pinch && e.touches.length === 2) {
      e.preventDefault();
      var nd = dist(e.touches[0], e.touches[1]);
      scale = Math.min(6, Math.max(1, pinch.s * (nd / pinch.d)));
      tx = pinch.tx + ((e.touches[0].clientX + e.touches[1].clientX) / 2 - pinch.cx);
      ty = pinch.ty + ((e.touches[0].clientY + e.touches[1].clientY) / 2 - pinch.cy);
      apply();
    } else if (pan && e.touches.length === 1 && scale > 1) {
      e.preventDefault();
      tx = pan.tx + (e.touches[0].clientX - pan.x);
      ty = pan.ty + (e.touches[0].clientY - pan.y);
      apply();
    }
  }, { passive: false });

  function end(e) {
    if (e.touches.length === 0) { pinch = null; pan = null; }
    else if (e.touches.length === 1) { pinch = null; }
  }
  img.addEventListener('touchend', end);
  img.addEventListener('touchcancel', end);

  // 桌面鼠标滚轮缩放（1×–6×），回到 1× 时复位平移
  img.addEventListener('wheel', function (e) {
    e.preventDefault();
    scale = Math.min(6, Math.max(1, scale * (e.deltaY < 0 ? 1.12 : 1 / 1.12)));
    if (scale === 1) { tx = 0; ty = 0; }
    apply();
  }, { passive: false });

  function closeLb() {
    reset();
    lb.hidden = true;
    if (shotObjectUrl) { URL.revokeObjectURL(shotObjectUrl); shotObjectUrl = null; }
    img.removeAttribute('src');   // 不保留已 revoke 的 blob: URL
    try { canvas.focus({ preventScroll: true }); } catch (e) {}  // 焦点归还到截图
  }
  window.closeShotLightbox = closeLb;   // 供顶层 ESC 处理调用
  canvas.addEventListener('click', openLb);          // 点图片本身 → 全屏放大
  $('shotShowBtn').addEventListener('click', openLb); // 左上「预览」按钮 → 全屏放大
  $('lightboxClose').addEventListener('click', closeLb);
  lb.addEventListener('click', function (e) {
    if (e.target === this) closeLb();   // 点遮罩空白处退出
  });
})();
$('shotCopy').addEventListener('click', onShotCopyClick);
$('shotDownload').addEventListener('click', function () { downloadShot($('shotCanvas')); });

/* 粘顶元素（标签页）要钉在顶栏下方，偏移必须按真实高度算：
   顶栏含 env(safe-area-inset-top)，硬编码在刘海屏上会留缝或压住 */
function syncStickyOffsets() {
  var root = document.documentElement.style;
  var top = document.querySelector('.topbar');
  if (top && top.offsetHeight) root.setProperty('--topbar-h', top.offsetHeight + 'px');
  syncReadLayout();
}

/* 部门日志改成「头部卡 + 列表卡内滚」后，paneRead 必须有确定高度，否则 flex 列表卡没有可分配空间。
   高度 = 视口 - 顶栏 - 标签页(含其下外边距) - main 上下内边距；键盘弹起/地址栏收起都用同一口径重算 */
function syncReadLayout() {
  var pane = $('paneRead');
  if (!pane) return;
  var top = document.querySelector('.topbar');
  var tabs = document.querySelector('.tabs');
  var mainEl = document.querySelector('main');
  if (!mainEl) return;
  var mainCS = getComputedStyle(mainEl);
  // .tabs 的 margin-top:-6px 已抵消 main 的 padding-top:6px，且 tabs.offsetHeight 含其
  // 自身 padding-top:6px；再减 padTop 会让 --read-h 少 6px（底部留一条灰缝），故只算 padBottom
  var padBottom = parseFloat(mainCS.paddingBottom) || 0;
  var tabsMB = tabs ? (parseFloat(getComputedStyle(tabs).marginBottom) || 0) : 0;
  var avail = window.innerHeight
    - (top ? top.offsetHeight : 0)
    - (tabs ? tabs.offsetHeight : 0)
    - tabsMB - padBottom;
  pane.style.setProperty('--read-h', Math.max(280, Math.round(avail)) + 'px');
}
/* resize / visualViewport.resize 在地址栏收放、键盘动画期会逐帧触发，而 syncStickyOffsets
   内部有 getComputedStyle + 多次 offsetHeight 的强制布局，用 rAF 合并成每帧最多一次 */
var stickySyncRaf = 0;
function scheduleSyncSticky() {
  if (stickySyncRaf) return;
  stickySyncRaf = requestAnimationFrame(function () { stickySyncRaf = 0; syncStickyOffsets(); });
}
window.addEventListener('resize', scheduleSyncSticky);
if (window.visualViewport) window.visualViewport.addEventListener('resize', scheduleSyncSticky);

function switchTab(tab) {
  state.tab = tab;
  $('tabWriteBtn').setAttribute('aria-selected', tab === 'write' ? 'true' : 'false');
  $('tabReadBtn').setAttribute('aria-selected', tab === 'read' ? 'true' : 'false');
  $('paneWrite').hidden = tab !== 'write';
  $('paneRead').hidden = tab !== 'read';
  // 部门日志是「整屏固定 + 列表卡内滚」，底部留白要跟着收窄（先改标记再量高度）
  document.body.classList.toggle('read-mode', tab === 'read');
  // 日期/部门筛选行跟着当前视图走（同一个节点复用，避免两份控件与两份状态）
  var bar = $('filtersBar');
  var card = document.querySelector(tab === 'write' ? '#paneWrite .card' : '#paneRead .read-head');
  if (card && bar.parentNode !== card) card.insertBefore(bar, card.firstChild);
  syncStickyOffsets();
  if (tab === 'read' && !state.auth) return;
  if (tab === 'read' && state.deptLogKey !== (state.date + '|' + (state.viewDeptId || 'all'))) {
    loadDeptLogs().catch(function (e) {
      if (e.message !== 'AUTH_EXPIRED') setNotice('dept', 'error', '读取部门日志失败：' + e.message);
    });
  }
}

$('tabWriteBtn').addEventListener('click', function () { switchTab('write'); });
$('tabReadBtn').addEventListener('click', function () { switchTab('read'); });

/* 页面卸载/切后台强制保存未提交草稿 */
window.addEventListener('pagehide', flushDraft);
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'hidden') flushDraft();
});

/* ---------- 启动 ---------- */
(function init() {
  state.auth = loadAuth();
  state.date = todayStr();
  $('dateInput').value = state.date;
  renderAuthState();

  if (!state.auth && idleExpired) {
    loginError('登录状态已超过 3 天未使用，为安全起见已清除，请重新登录');
  }

  if (state.auth) {
    bootstrap().catch(function (e) {
      if (e.message !== 'AUTH_EXPIRED') setNotice('general', 'error', e.message);
    });
  } else {
    switchTab('write');
    renderWritePane();
  }
})();
</script>
